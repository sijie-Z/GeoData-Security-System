name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Lint & Test ──────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: testrealend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies for GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libzbar0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          GDAL_VER=$(gdal-config --version) && pip install gdal==$GDAL_VER
          pip install ruff==0.15.12 pytest pytest-cov

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Run tests
        run: |
          set -o pipefail
          pytest --tb=short -q 2>&1 | tee /tmp/pytest_ci.log
        env:
          FLASK_ENV: testing

      # 失败时把 pytest 摘要自动评论到 issue，便于远程/匿名诊断 CI 红因
      - name: Report test failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          try:
              tail = open('/tmp/pytest_ci.log', encoding='utf-8', errors='replace').read()[-2800:]
          except OSError:
              tail = '(no pytest log captured)'
          body = "CI backend pytest failure summary (auto):\n```\n" + tail + "\n```"
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(body + "\n")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST')
          try:
              urllib.request.urlopen(req, timeout=20)
              print('failure summary posted')
          except Exception as e:
              print('comment failed:', e)
          PY

  # ─── Frontend Lint & Build ────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testrealfrontol

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: testrealfrontol/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── Accessibility Smoke (axe-core gate) ──────────────────
  # 持续门禁：critical/serious axe violation 即红。公开页无需后端；
  # 认证页用 FLASK_ENV=testing（SQLite，与 backend job 同配置）+ ci_seed.py
  # 种子用户 admin/admin123 与 TEST001/test123456，前端 dev server（:4173）
  # 经 vite proxy 打到 :5003。
  #
  # 已知留档：认证页扫描**不含** information_add —— 该页 .el-upload-list 的
  # axe `list`（serious）源自 Element Plus 上游渲染（div[role=button] 直渲进
  # <ul>），DOM 重排实测会触发 Vue insertBefore 崩溃（见 CHANGELOG 留档）。
  # 解除条件：EP 修复该渲染方式或我方安全重构上传列表后，将路由加入
  # testrealfrontol/scripts/a11y-smoke.mjs 的 ADMIN_PAGES。
  a11y:
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 12
    defaults:
      run:
        working-directory: testrealfrontol

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: testrealfrontol/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: testrealend/requirements.txt

      - name: Install system dependencies for GDAL
        working-directory: testrealend
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libzbar0

      - name: Install backend dependencies
        working-directory: testrealend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          GDAL_VER=$(gdal-config --version) && pip install gdal==$GDAL_VER

      - name: Seed testing SQLite database (users only)
        working-directory: testrealend
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-a11y-secret
          JWT_SECRET_KEY: ci-a11y-jwt-secret
        run: python scripts/ci_seed.py

      - name: Start backend on :5003
        working-directory: testrealend
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-a11y-secret
          JWT_SECRET_KEY: ci-a11y-jwt-secret
          PORT: "5003"
        run: |
          nohup python app.py > /tmp/a11y-backend.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5003/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo 'BACKEND FAILED: /api/health never became ready'
            tail -200 /tmp/a11y-backend.log || true
            exit 1
          fi
          echo 'backend healthy on :5003'

      - name: Start frontend dev server on :4173
        working-directory: testrealfrontol
        run: |
          nohup npx vite --port 4173 --strictPort > /tmp/a11y-vite.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173/login >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo 'VITE FAILED: :4173 never became ready'
            tail -200 /tmp/a11y-vite.log || true
            exit 1
          fi
          echo 'vite ready on :4173'

      - name: Run axe accessibility smoke
        working-directory: testrealfrontol
        env:
          BASE_URL: http://localhost:4173
          A11Y_SCOPE: all
        run: npm run a11y

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: testrealfrontol/a11y-report.json
          if-no-files-found: warn

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo '---- backend log (tail) ----'
          tail -200 /tmp/a11y-backend.log || true
          echo '---- vite log (tail) ----'
          tail -200 /tmp/a11y-vite.log || true

  # ─── Docker Build Check ───────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t geodata-backend ./testrealend

      # 运行期冒烟：build 只能证明镜像能构建，下面两步证明镜像真的能启动。
      # FLASK_ENV=testing → TestingConfig 走 SQLite（同 conftest），无需 MySQL/Redis。
      - name: Smoke-test backend image (app factory + routes)
        run: |
          docker run --rm --workdir /app \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-smoke-secret \
            -e JWT_SECRET_KEY=ci-smoke-jwt-secret \
            geodata-backend \
            python -c "import app; a = app.create_app(); n = len(list(a.url_map.iter_rules())); print(f'SMOKE OK: app factory built, {n} routes'); assert n > 100, n"

      - name: Smoke-test backend image (gunicorn CMD serves /api/health)
        run: |
          docker run -d --name backend-smoke \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-smoke-secret \
            -e JWT_SECRET_KEY=ci-smoke-jwt-secret \
            geodata-backend
          ok=0
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Running}}' backend-smoke 2>/dev/null)" != "true" ]; then
              echo "container exited before becoming healthy (attempt $i)"
              break
            fi
            if docker exec backend-smoke python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5003/api/health', timeout=3).status)"; then
              ok=1
              break
            fi
            sleep 3
          done
          echo '---- container logs ----'
          docker logs backend-smoke || true
          docker rm -f backend-smoke >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo 'SMOKE FAILED: backend image did not serve /api/health'
            exit 1
          fi
          echo 'SMOKE OK: gunicorn CMD served /api/health'

      - name: Build frontend image
        run: docker build -t geodata-frontend ./testrealfrontol

      - name: Smoke-test frontend image (nginx config)
        # proxy_pass http://backend:5003 在配置解析期就需要解析 backend 主机名；
        # 冒烟容器不在 compose 网络里，--add-host 提供占位解析（真实 compose 部署里
        # 该名字由 Docker 网络解析）。
        run: docker run --rm --add-host backend:127.0.0.1 --entrypoint nginx geodata-frontend -t
