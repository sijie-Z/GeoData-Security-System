name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Lint & Test ──────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: testrealend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies for GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libzbar0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          GDAL_VER=$(gdal-config --version) && pip install gdal==$GDAL_VER
          pip install ruff==0.15.12 pytest pytest-cov

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Run tests
        run: |
          set -o pipefail
          pytest --tb=short -q 2>&1 | tee /tmp/pytest_ci.log
        env:
          FLASK_ENV: testing

      # 失败时把 pytest 摘要自动评论到 issue，便于远程/匿名诊断 CI 红因
      - name: Report test failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          try:
              tail = open('/tmp/pytest_ci.log', encoding='utf-8', errors='replace').read()[-2800:]
          except OSError:
              tail = '(no pytest log captured)'
          body = "CI backend pytest failure summary (auto):\n```\n" + tail + "\n```"
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(body + "\n")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST')
          try:
              urllib.request.urlopen(req, timeout=20)
              print('failure summary posted')
          except Exception as e:
              print('comment failed:', e)
          PY

  # ─── Frontend Lint & Build ────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testrealfrontol

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: testrealfrontol/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─── Docker Build Check ───────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t geodata-backend ./testrealend

      - name: Build frontend image
        run: docker build -t geodata-frontend ./testrealfrontol
