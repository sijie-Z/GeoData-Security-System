# 密钥扫描（gitleaks）——在 push / pull_request 时扫描“本次新增提交”，阻止新凭据进入仓库。
#
# ⚠️ 历史遗留项说明（重要）：
# 本仓库的 git 历史中仍保留着已从 HEAD 移除的凭据文件（此前只做了 HEAD 层清除，
# 未改写历史）。gitleaks-action 在 push / PR 事件下只扫描本次推送 / 该 PR 的提交，
# 因此不会因历史遗留项而失败；但任何“全历史扫描”（例如本地不带 --log-opts 直接执行
# `gitleaks detect`，或 schedule / workflow_dispatch 触发本 action）仍会报告这些
# 历史遗留项，直至用户决定清除 git 历史（git filter-repo + force-push）为止。
name: Secret Scan (gitleaks)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks (new commits only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需完整历史以计算本次推送/PR 的提交区间；扫描范围仍限新增提交
      # 版本固定说明：gitleaks-action 使用 v2 大版本 tag；如需更严格的供应链加固，
      # 可将下方改为固定完整 commit SHA。组织（org）仓库使用该 action 需配置
      # GITLEAKS_LICENSE（个人仓库无需）。
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
