# Dependabot 版本更新 —— 自动为 npm / pip / GitHub Actions 依赖开 PR。
# 注意：Dependabot *告警*（含安全更新）是仓库设置里的独立开关（Settings → Security），
# 与版本更新互不影响。
version: 2
updates:
  - package-ecosystem: npm
    directory: /testrealfrontol
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(frontend)"
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /testrealend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(backend)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # 所有 actions 更新合并进单个 PR：codeql-action 的 init/autobuild/analyze/
    # upload-sarif 必须整体同版本升级，拆开单独升会因 "Loaded a configuration
    # file for version X, but running version Y" 死锁。
    groups:
      github-actions:
        patterns:
          - "*"
